name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'EOF'

          set -e

          cd ~/Open-Source-Project-Intelligence

          echo "Updating production code..."
          git checkout main
          git pull --ff-only origin main

          echo "Loading production secrets..."
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "open-source-project/production" \
            --query SecretString \
            --output text)

          export OPENAI_API_KEY=$(printf '%s' "$SECRET_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['OPENAI_API_KEY'])")
          export GITHUB_TOKEN=$(printf '%s' "$SECRET_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['GITHUB_TOKEN'])")
          export DB_PASSWORD=$(printf '%s' "$SECRET_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['DB_PASSWORD'])")

          unset SECRET_JSON

          echo "Building Docker images..."
          docker compose build

          echo "Starting services..."
          docker compose up -d

          echo "Deployment status:"
          docker compose ps

          EOF
